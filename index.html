<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie</title>
    <!-- Swiper CSS : head 안에 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- 내가 작성한 CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- fontawesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">


</head>

<body>
    <div class="bg">
        <header>
            <div class="menu">
                <h1><a href="index2.html"><img src="img/stub-logo.png" alt="logo"></a></h1>
                <!-- <ul>
          <li><a href="#">HOME</a></li>
          <li><a href="#">NOW</a></li>
          <li><a href="#">COMING</a></li>
          <li><a href="#">MY BOOK</a></li>
        </ul> -->
            </div>

        </header>
        <section id="con01">
            <div class="txt">
                <div class="txt_left">
                    <p>NOW SHOWING & COMMING SOON</p>
                    <h2>보고 싶은 영화를<br>
                        내 티켓북에 담아보세요</h2>
                </div>
                <div class="txt_right">
                    <p>담은 영화 <span id="count">0</span></p>
                    <div class="btn-group" role="group" aria-label="Basic checkbox toggle button group">
                        <label class="btn btn-primary">
                            <input onclick="movie(`now_playing`)" type="radio" name="movie" autocomplete="off">
                            상영영화
                        </label>
                        <label class="btn btn-primary">
                            <input onclick="movie(`popular`)" type="radio" name="movie" autocomplete="off">
                            인기영화
                        </label>
                        <label class="btn btn-primary">
                            <input onclick="movie(`top_rated`)" type="radio" name="movie" autocomplete="off">
                            추천영화
                        </label>
                        <label class="btn btn-primary">
                            <input onclick="movie(`upcoming`)" type="radio" name="movie" autocomplete="off">
                            예정영화
                        </label>
                    </div>

                </div>


            </div>

        </section>
        <div class="Search">
            <input type="text" id="SearchInput" class="form-control" placeholder="영화명 검색"
                onkeypress="if(event.keyCode==13) {enter();}">

            <button type="button" class="btn btn-primary" id="SearchBtn" onclick="enter()">검색</button>
        </div>

        <div class="ticket">

            <div class="swiper">

                <!-- JS에서 영화 포스터가 들어오는 영역 -->
                <div class="swiper-wrapper" id="movieBoard"></div>

                <!-- 이전 버튼 -->
                <div class="swiper-button-prev"></div>

                <!-- 다음 버튼 -->
                <div class="swiper-button-next"></div>


            </div>
            <button type="button" class="btn btn-primary" id="ticketBtn">담기</button>
        </div>
    </div>

    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <!-- 내가 작성한 JS -->
    <script src="custom.js"></script>

</body>

</html>
